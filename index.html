
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okul Kütüphanesi Yönetim Sistemi</title>
  <style>
    :root {
      --primary: #174a7e;
      --background: #f2f6fb;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--background);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 12px 35px #174a7e18;
      text-align: center;
    }
    .logo { font-size: 56px; }
    h1 { color: var(--primary); font-size: 25px; }
    p { color: #64748b; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 15px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      background: var(--primary);
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
    .error { color: #b91c1c; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">📚</div>
    <h1>Okul Kütüphanesi</h1>
    <p>Yönetim Sistemine Hoş Geldiniz</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="E-posta adresiniz"
        autocomplete="username" required>

      <input id="password" type="password"
        placeholder="Şifreniz"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">
        Giriş Yap
      </button>
    </form>

    <div id="message" class="message"
      role="status" aria-live="polite"></div>
  </main>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://eiigjfmriawycgmkoeyc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Dqr44bblFcEgWBNJx-bkSw_cc8UV0m2";

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    button.disabled = true;
    button.textContent = "Giriş yapılıyor...";
    message.className = "message";
    message.textContent = "";

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      if (!data.user) {
        throw new Error("Kullanıcı bilgisi alınamadı.");
      }

      message.textContent = "Giriş başarılı! Yönetim paneli hazırlanıyor.";
    } catch (error) {
      message.className = "message error";
      message.textContent = error.message === "Invalid login credentials"
        ? "E-posta veya şifre hatalı."
        : "Giriş yapılamadı: " + error.message;
    } finally {
      button.disabled = false;
      button.textContent = "Giriş Yap";
    }
  });
</script>

</body>
</html>
